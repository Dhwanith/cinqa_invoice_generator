services:

  operator-app:
    build:
      context: .
      dockerfile: Dockerfile.pdf-service
    container_name: cinqa-operator-app
    env_file:
      - .env
    environment:
      APP_PORT: "3010"
    ports:
      - "3010:3010"
    command: ["npm", "run", "app:server"]
    restart: unless-stopped

  pdf-worker:
    build:
      context: .
      dockerfile: Dockerfile.pdf-service
    container_name: cinqa-pdf-worker
    env_file:
      - .env
    command: ["npm", "run", "pdf:worker"]
    restart: unless-stopped
    # No ports — internal background worker only.

  pdf-service:
    build:
      context: .
      dockerfile: Dockerfile.pdf-service
    container_name: cinqa-pdf-service
    env_file:
      - .env
    environment:
      PDF_SERVICE_PORT: "3001"
    ports:
      - "3001:3001"
    command: ["npm", "run", "pdf:service"]
    restart: unless-stopped
    # Kept for local testing via curl or Postman.
    # Nothing in the app stack calls it directly.
