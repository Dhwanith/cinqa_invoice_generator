# =============================================================================
# Nginx site config — Cinqa Invoice Services
# Deploy:  cp nginx/cinqa-invoice-services.conf /etc/nginx/sites-available/cinqa-invoice-services
#          ln -sf /etc/nginx/sites-available/cinqa-invoice-services /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
#
# SSL: managed by Certbot — run after enabling this config:
#          certbot --nginx -d invoice.cinqa.space -d pdf-internal.cinqa.space
# =============================================================================


# ── Operator app — invoice.cinqa.space ────────────────────────────────────────
# Proxies to Docker container cinqa-operator-app (127.0.0.1:8010).
#
# Timeout rationale (reduced from 600s):
#   - Invoice creation:      <100 ms  (Supabase write, atomic sequence)
#   - PDF status check:      <100 ms  (Supabase single-row SELECT)
#   - PDF download (stored): <500 ms  (Supabase Storage signed URL redirect)
#   - PDF download (live):   20–40 s  (on-demand Puppeteer fallback)
#   120s covers the worst case with comfortable headroom.

server {
    listen 80;
    server_name invoice.cinqa.space;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        send_timeout 120s;

        proxy_buffering off;
    }
}


# ── PDF internal service — pdf-internal.cinqa.space ──────────────────────────
# Proxies to Docker container cinqa-pdf-service (127.0.0.1:8001).
# Protected by HTTP basic auth — credentials in /etc/nginx/.htpasswd-cinqa-pdf.
#
# NOTE: Nothing in the current app stack calls this service.
# - operator-app renders PDFs directly via renderInvoicePdfBuffer() in-process.
# - pdf-worker renders PDFs directly via renderInvoicePdfBuffer() in-process.
# - n8n was the only external caller (via PDF_SERVICE_URL) — n8n no longer does this.
#
# This block (and the cinqa-pdf-service container) can be removed once you
# confirm no external curl scripts, monitoring, or integrations still hit this domain.

server {
    listen 80;
    server_name pdf-internal.cinqa.space;

    client_max_body_size 10m;

    auth_basic "Cinqa PDF Service";
    auth_basic_user_file /etc/nginx/.htpasswd-cinqa-pdf;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        send_timeout 120s;

        proxy_buffering off;
    }
}
