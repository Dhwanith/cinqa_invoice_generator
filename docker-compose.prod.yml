services:

  operator-app:
    build:
      context: .
      dockerfile: Dockerfile.pdf-service
    container_name: cinqa-operator-app
    env_file:
      - .env
    environment:
      APP_PORT: "8010"
    ports:
      - "127.0.0.1:8010:8010"
    command: ["npm", "run", "app:server"]
    restart: unless-stopped

  pdf-worker:
    build:
      context: .
      dockerfile: Dockerfile.pdf-service
    container_name: cinqa-pdf-worker
    env_file:
      - .env
    command: ["npm", "run", "pdf:worker"]
    restart: unless-stopped
    # No ports — internal background worker only.
    # Polls Supabase pdf_generation_jobs, renders PDFs with Puppeteer,
    # uploads to Supabase Storage, updates invoices.pdf_storage_path.

  # pdf-service is kept for backwards compatibility.
  # Nothing in the current app stack calls it — operator-app and pdf-worker
  # both render PDFs directly via src/services/pdf.js (renderInvoicePdfBuffer).
  # It was previously called by n8n via PDF_SERVICE_URL — n8n no longer does this.
  # Safe to remove from a future deploy once you confirm no external callers remain.
  pdf-service:
    build:
      context: .
      dockerfile: Dockerfile.pdf-service
    container_name: cinqa-pdf-service
    env_file:
      - .env
    environment:
      PDF_SERVICE_PORT: "8001"
    ports:
      - "127.0.0.1:8001:8001"
    command: ["npm", "run", "pdf:service"]
    restart: unless-stopped
